[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rafiq-server"
version = "0.1.0"
description = "Thin HTTP API and dev playground over rafiq-engine"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["rafiq-engine", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/rafiq_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
