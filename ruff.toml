# Style for loose scripts outside the packages (eval/). The packages carry the
# same settings in their own pyproject.toml so they stay self-contained.
line-length = 110
# Vendored third-party code stays byte-identical to upstream.
extend-exclude = ["tools/whisper_export/sherpa_export_onnx.py"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
