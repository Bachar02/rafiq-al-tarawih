[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rafiq-engine"
version = "0.1.0"
description = "Quran position-recognition engine for Rafiq al-Tarawih"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "numpy>=1.24"]
# Audio -> text. faster-whisper's bundled audio decoder breaks on PyAV >= 15, so
# rafiq.asr decodes with PyAV directly and any recent PyAV works.
asr = ["numpy>=1.24", "faster-whisper>=1.1", "av>=12"]

[tool.hatch.build.targets.wheel]
packages = ["src/rafiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Frozen config dataclasses are immutable, so they are safe as argument defaults.
extend-immutable-calls = [
    "rafiq.matching.align.AlignConfig",
    "rafiq.matching.matcher.MatchConfig",
    "rafiq.simulate.NoiseConfig",
    "rafiq.tracking.TrackerConfig",
    "rafiq.words.WordTrackerConfig",
    "rafiq.asr.segmenter.SegmenterConfig",
    "rafiq.asr.listener.ListenerConfig",
]
